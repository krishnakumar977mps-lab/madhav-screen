plugins {
    id 'com.android.application'
}

android {
    namespace 'com.madhav.screen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.madhav.screen'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.18.1@aar'
}
